<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake Game</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://unpkg.com/ml5@0.4.3/dist/ml5.min.js"></script>

    <style>
        body {
            background: linear-gradient(-45deg, #00f2fe, #fbc2eb);
            background-attachment: fixed;
            text-align: center;
        }

        h1 {
            color: #002a69;
        }

        canvas {
            border: 3px dashed rgb(0, 0, 158);
        }
    </style>
</head>

<body>
    <h1>Snake Game</h1>
    <hr style="width: 40%;">

    <script>
        let video;
        let poseNet;

        let x, y;

        let sx = 325;
        let sy = 240;
        let size = 20;

        function setup() {
            createCanvas(650, 480);

            video = createCapture(VIDEO);
            video.hide();

            poseNet = ml5.poseNet(video, modelLoad);
            poseNet.on("pose", gotResult);
        }

        function modelLoad() {
            console.log("Model is loaded");
        }

        function gotResult(poses) {
            if (poses.length > 0) {
                x = poses[0].pose.keypoints[0].position.x;
                y = poses[0].pose.keypoints[0].position.y;

                console.log("Nose position:", x, y);
            }
        }

        function draw() {
            background("white");
            drawSnake();
        }

        function drawSnake() {
            stroke("green");
            fill("green");
            rect(sx, sy, size, size);
        }
    </script>
</body>
</html>
