<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake Game</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://unpkg.com/ml5@0.4.3/dist/ml5.min.js"></script>

    <style>
        body {
            background: linear-gradient(-45deg, #00f2fe, #fbc2eb);
            background-attachment: fixed;
            text-align: center;
        }

        h1 {
            color: #002a69;
        }

        canvas {
            border: 3px dashed rgb(0, 0, 158);
        }
    </style>
</head>

<body>
    <h1>Snake Game</h1>
    <hr style="width: 40%;">

    <script>
        let video;
        let poseNet;

        let x, y;

        let sx = 325;
        let sy = 240;

        let fx = 200;
        let fy = 150;

        let dirX = 0;
        let dirY = 0;

        let score = 0;
        let size = 20;

        let gameStarted = false;

        function setup() {
            createCanvas(650, 480);

            video = createCapture(VIDEO);
            video.hide();

            poseNet = ml5.poseNet(video, modelLoad);
            poseNet.on("pose", gotResult);
        }

        function modelLoad() {
            console.log("Model is loaded");
        }

        function gotResult(poses) {
            if (poses.length > 0) {
                x = poses[0].pose.keypoints[0].position.x;
                y = poses[0].pose.keypoints[0].position.y;

                if (!gameStarted) {
                    gameStarted = true;
                }

                if (x > sx + 10) {
                    dirX = 5;
                    dirY = 0;
                } else if (x < sx - 10) {
                    dirX = -5;
                    dirY = 0;
                }

                if (y > sy + 10) {
                    dirX = 0;
                    dirY = 5;
                } else if (y < sy - 10) {
                    dirX = 0;
                    dirY = -5;
                }
            }
        }

        function draw() {
            background("white");

            if (gameStarted) {
                moveSnake();
                drawSnake();
                drawFood();
                drawScore();

                if (check_collision()) {
                    resetGame();
                }
            } else {
                fill("black");
                textSize(25);
                text("Move your nose to start the game", 100, 240);
            }
        }

        function drawSnake() {
            stroke("green");
            fill("green");
            rect(sx, sy, size, size);
        }

        function drawFood() {
            stroke("red");
            fill("red");
            ellipse(fx, fy, size);
        }

        function drawScore() {
            fill("black");
            noStroke();
            textSize(25);
            text("Score: " + score, 325, 25);
        }

        function moveSnake() {
            sx += dirX;
            sy += dirY;

            if (dist(sx, sy, fx, fy) < size) {
                score += 10;
                changeFoodPosition();
            }
        }

        function changeFoodPosition() {
            fx = floor(random(50, 600));
            fy = floor(random(50, 440));
        }

        function check_collision() {
            return (
                sx <= 0 ||
                sx >= 650 ||
                sy <= 0 ||
                sy >= 480
            );
        }

        function resetGame() {
            alert("Game over! Your score: " + score);

            sx = 325;
            sy = 240;

            fx = 200;
            fy = 150;

            dirX = 0;
            dirY = 0;

            score = 0;
            gameStarted = false;
        }
    </script>
</body>
</html>
