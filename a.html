<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake Game</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://unpkg.com/ml5@0.4.3/dist/ml5.min.js"></script>

    <style>
        body {
            background: linear-gradient(-45deg, #00f2fe, #fbc2eb);
            background-attachment: fixed;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #002a69;
        }

        canvas {
            border: 3px dashed rgb(0, 0, 158);
            margin-top: 10px;
        }

        button {
            background-color: #002a69;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <h1>Snake Game 🐍</h1>
    <hr style="width: 40%;">

    <p>Move your nose to control the snake!</p>

    <button onclick="restartGame()">Restart Game</button>

    <script>
        let video;
        let poseNet;

        let x, y;

        let sx = 325;
        let sy = 240;

        let fx = 200;
        let fy = 150;

        let dirX = 0;
        let dirY = 0;

        let score = 0;
        let size = 20;

        let gameStarted = false;
        let gameOver = false;

        function setup() {
            createCanvas(650, 480);

            video = createCapture(VIDEO);
            video.hide();

            poseNet = ml5.poseNet(video, modelLoad);
            poseNet.on("pose", gotResult);
        }

        function modelLoad() {
            console.log("Model is loaded");
        }

        function gotResult(poses) {
            if (poses.length > 0 && !gameOver) {
                x = poses[0].pose.keypoints[0].position.x;
                y = poses[0].pose.keypoints[0].position.y;

                if (!gameStarted) {
                    gameStarted = true;
                }

                if (x > sx + 10) {
                    dirX = 5;
                    dirY = 0;
                } else if (x < sx - 10) {
                    dirX = -5;
                    dirY = 0;
                }

                if (y > sy + 10) {
                    dirX = 0;
                    dirY = 5;
                } else if (y < sy - 10) {
                    dirX = 0;
                    dirY = -5;
                }
            }
        }

        function draw() {
            background("white");

            drawScore();

            if (gameOver) {
                drawGameOver();
                return;
            }

            if (gameStarted) {
                moveSnake();
                drawSnake();
                drawFood();

                if (check_collision()) {
                    endGame();
                }
            } else {
                fill("black");
                noStroke();
                textSize(25);
                textAlign(CENTER, CENTER);
                text("Move your nose to start the game", 325, 240);
            }
        }

        function drawSnake() {
            stroke("green");
            fill("green");
            rect(sx, sy, size, size);
        }

        function drawFood() {
            stroke("red");
            fill("red");
            ellipse(fx, fy, size, size);
        }

        function drawScore() {
            fill("black");
            noStroke();
            textSize(22);
            textAlign(LEFT, TOP);
            text("Score: " + score, 10, 10);
        }

        function moveSnake() {
            sx += dirX;
            sy += dirY;

            if (dist(sx + size / 2, sy + size / 2, fx, fy) < size) {
                score += 10;
                changeFoodPosition();
            }
        }

        function changeFoodPosition() {
            fx = floor(random(20, 630));
            fy = floor(random(20, 460));
        }

        function check_collision() {
            return (
                sx < 0 ||
                sx + size > width ||
                sy < 0 ||
                sy + size > height
            );
        }

        function endGame() {
            gameOver = true;
            gameStarted = false;
        }

        function drawGameOver() {
            fill("red");
            noStroke();
            textAlign(CENTER, CENTER);
            textSize(40);
            text("GAME OVER", width / 2, height / 2 - 30);

            fill("black");
            textSize(22);
            text("Final Score: " + score, width / 2, height / 2 + 20);

            textSize(16);
            text("Click Restart Game to play again", width / 2, height / 2 + 60);
        }

        function restartGame() {
            sx = 325;
            sy = 240;

            score = 0;

            dirX = 0;
            dirY = 0;

            gameStarted = false;
            gameOver = false;

            changeFoodPosition();
        }
    </script>
</body>
</html>
